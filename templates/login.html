<!-- templates/login.html -->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - KMITL TABLE TENNIS CLUB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 border-t-4 border-orange-600">
        <!-- โลโก้ไก่ส้มตรงกลาง -->
        <div class="text-center mb-6">
            <img src="/static/logo.jpg" alt="Logo" class="w-28 h-28 mx-auto rounded-full object-cover border-4 border-orange-500 shadow-md bg-white mb-3">
            <h1 class="text-xl font-bold text-slate-800">KMITL TABLE TENNIS CLUB</h1>
            <p class="text-xs text-slate-500 mt-1">ระบบจัดการและบันทึกผลการแข่งขันปิงปอง</p>
        </div>

        <!-- ข้อความแจ้งเตือนเมื่อรหัสผ่านผิด -->
        {% if error %}
        <div class="bg-red-50 text-red-600 border border-red-200 text-sm p-3 rounded-lg mb-4 text-center">
            <i class="fa-solid fa-triangle-exclamation mr-1"></i> {{ error }}
        </div>
        {% endif %}

        <!-- ฟอร์มเข้าสู่ระบบ -->
        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">ชื่อผู้ใช้</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" name="username" required placeholder="กรอกชื่อผู้ใช้" class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">รหัสผ่าน</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" name="password" required placeholder="กรอกรหัสผ่าน" class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500">
                </div>
            </div>

            <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-2.5 rounded-lg text-sm transition shadow-md flex items-center justify-center">
                <i class="fa-solid fa-right-to-bracket mr-2"></i> เข้าสู่ระบบ
            </button>
        </form>
    </div>

</body>
</html>
